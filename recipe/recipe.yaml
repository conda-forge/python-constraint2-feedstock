schema_version: 1

context:
  python_min: "3.11"
  version: "2.7.3"

package:
  name: python-constraint2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/python-constraint2/python_constraint2-${{ version }}.tar.gz
  sha256: 9e0dbf061a7be7f2837239cbc51e3d0c5f9521724fb07a987c64f0bf3bce6438

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip:
    - match(python, "<" ~ python_min)

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - poetry-core
    - setuptools
    - cython
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - constraint
      pip_check: true
  - files:
      source:
        - pyproject.toml
        - tests
        - README.rst
    requirements:
      run:
        - pep440
        - pytest
        - pytest-benchmark
    script:
      - pytest --ignore tests/test_constraint.py --ignore tests/test_examples.py --ignore tests/test_compilation.py -o addopts=

about:
  summary: python-constraint is a module for efficiently solving CSPs (Constraint Solving Problems) over finite domains.
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: http://python-constraint.github.io/python-constraint/
  repository: https://github.com/python-constraint/python-constraint
  documentation: http://python-constraint.github.io/python-constraint/

extra:
  recipe-maintainers:
    - bouweandela
    - fjwillemsen
